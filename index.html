<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Dash Kids - Holiday Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui-layer">
        <h1 class="title">NEON DASH</h1>
        <div class="subtitle">Tap Anywhere to Start!</div>
        
        <div class="toggle-container" id="toddler-toggle">
            <div class="checkbox checked" id="mode-check"></div>
            <div class="toggle-label">Toddler Mode (Never Die)</div>
        </div>
    </div>

    <div id="level-select-layer" style="display: none;">
        <h2 class="title" style="margin-bottom: 30px;">Pick a Level!</h2>
        <div class="level-card" id="level-cameron">
            <div class="level-thumb">⭐</div>
            <div class="level-title">Cameron</div>
        </div>
        
        <div id="btn-back-start" style="margin-top: 40px; color: #fff; font-size: 1.5rem; text-decoration: underline; cursor: pointer; text-shadow: 0 2px 5px rgba(0,0,0,0.8);">
            🔙 Back to Start
        </div>
    </div>

    <div id="hud">
        <div id="progress-bar"></div>
    </div>
    <div id="level-text">Level 1</div>

    <div id="pause-btn" style="display: none;">⏸️</div>

    <div id="pause-layer" style="display: none;">
        <div class="pause-menu-card">
            <div class="pause-btn-large" id="btn-resume">▶️ Play</div>
            <div class="pause-btn-large" id="btn-restart">🔄 Restart</div>
            <div class="pause-btn-large" id="btn-home">🏠 Home</div>
        </div>
    </div>

    <audio id="music-space" src="music/Space.mp3" preload="auto"></audio>
    <audio id="music-summer" src="music/Summer.mp3" preload="auto"></audio>
    <audio id="music-winter" src="music/Winter.mp3" preload="auto"></audio>
    <audio id="music-halloween" src="music/Halloween.mp3" preload="auto"></audio>
    <audio id="music-easter" src="music/Easter.mp3" preload="auto"></audio>

    <canvas id="gameCanvas"></canvas>

    <script src="pixelArt.js"></script>
    <script src="game.js"></script>
</body>
</html>
